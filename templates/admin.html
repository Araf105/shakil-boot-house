<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Shakil Boot House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400">Shakil Boot House - Admin Dashboard</h1>
            <div class="flex items-center space-x-3">
                <a href="/" target="_blank" class="text-sm bg-gray-800 px-4 py-2 rounded-lg hover:bg-gray-700 transition font-medium">View Website ↗</a>
                <a href="/admin/logout" class="text-sm bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition font-bold shadow">Logout</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-6">
        
        <!-- Quick Navigation & Master Colors Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Quick Navigation -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-bold text-slate-900 mb-4 border-b pb-2">Quick Navigation</h2>
                <div class="grid grid-cols-2 gap-3">
                    <a href="/admin/add" class="flex flex-col items-center justify-center p-4 bg-amber-500 text-slate-900 font-bold rounded-xl shadow hover:bg-amber-400 transition text-center">
                        <span class="text-2xl mb-1">➕</span>
                        <span class="text-xs">Add Product</span>
                    </a>
                    <a href="/admin/manage" class="flex flex-col items-center justify-center p-4 bg-slate-900 text-white font-bold rounded-xl shadow hover:bg-slate-800 transition text-center">
                        <span class="text-2xl mb-1">📦</span>
                        <span class="text-xs">Manage Products</span>
                    </a>
                    <a href="/admin/discount-policy" class="flex flex-col items-center justify-center p-4 bg-emerald-600 text-white font-bold rounded-xl shadow hover:bg-emerald-500 transition text-center">
                        <span class="text-2xl mb-1">🏷️</span>
                        <span class="text-xs">Discount Policy</span>
                    </a>
                    <a href="/admin/orders" class="flex flex-col items-center justify-center p-4 bg-blue-600 text-white font-bold rounded-xl shadow hover:bg-blue-500 transition text-center">
                        <span class="text-2xl mb-1">🛍️</span>
                        <span class="text-xs">Customer Orders</span>
                    </a>
                </div>
            </div>

            <!-- Manage Master Colors -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-bold text-slate-900 mb-3 border-b pb-2">Manage Master Colors</h2>
                <form action="/admin/colors" method="POST" class="flex gap-2 mb-4">
                    <input type="text" name="new_color" required placeholder="Add new color (e.g. Olive)" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                    <button type="submit" class="bg-slate-900 text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-slate-800 transition">Add</button>
                </form>
                <div class="flex flex-wrap gap-2 max-h-28 overflow-y-auto">
                    {% for c in colors %}
                    <div class="flex items-center space-x-1 bg-gray-50 border border-gray-200 px-3 py-1 rounded-lg text-xs font-semibold text-gray-700 shadow-sm">
                        <span>{{ c }}</span>
                        <a href="/admin/colors/delete/{{ c }}" class="text-red-500 hover:text-red-700 font-bold ml-1 px-1 rounded hover:bg-red-50" title="Remove Color">×</a>
                    </div>
                    {% endfor %}
                </div>
            </div>

        </div>

    </main>

</body>
</html>
