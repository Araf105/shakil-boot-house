<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Shakil Boot House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-900 text-gray-800 font-sans flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-red-600">Shakil Boot House</h1>
            <p class="text-xs text-gray-500 font-semibold mt-1">Change Admin Password</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-600 text-xs font-bold p-3 rounded-lg mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="bg-green-50 border border-green-200 text-green-600 text-xs font-bold p-3 rounded-lg mb-4 text-center">
            {{ success }}
        </div>
        {% endif %}

        <form action="/admin/change-password" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Admin Username</label>
                <input type="text" name="username" required placeholder="Enter current username" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-600">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Current Password</label>
                <input type="password" name="current_password" required placeholder="Enter current password" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-600">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">New Password</label>
                <input type="password" name="new_password" required placeholder="Enter new password" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-600">
            </div>

            <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-500 shadow transition text-sm">
                Update Password
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/admin/login" class="text-xs text-gray-500 hover:text-red-600 font-medium">← Back to Login</a>
        </div>
    </div>

</body>
</html>
